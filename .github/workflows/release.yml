name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = $env:REF_NAME.TrimStart('v')
          if ($tag -ne $version) {
            throw "Tag $env:REF_NAME does not match workspace version $version"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Package portable bundle
        run: cargo run -p xtask -- package

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: cargo run -p xtask -- installer

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md-work-windows
          path: |
            dist/md-work-*-setup.exe
            dist/md-work-*-win64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/md-work-*-setup.exe
            dist/md-work-*-win64.zip
