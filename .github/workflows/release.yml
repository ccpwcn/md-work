# 发版只在 main 上进行：
#   - dev（及其他分支）的推送只跑 ci.yml 的构建与测试，无论是否带 v* 标签都不发版；
#   - 只有 main 的推送（且与 Cargo 版本一致的标签已进入 main 历史）才起草并发布 Release；
#   - 标签推送本身也会触发本流水线，但标签未进入 main 历史时直接跳过；
#   - 发版正文固定取与该标签同名的 doc/changelog/vX.Y.Z.md。
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # 只接受 main 分支推送或 v* 标签推送；workflow_dispatch 也必须选 main，
    # 禁止从 dev 或其他 ref 发版
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag on main and changelog
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Skip([string]$reason) {
            Write-Host $reason
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw '无法从 Cargo.toml 读取 [workspace.package].version' }
          $cargoTag = "v$version"
          $isTagEvent = $env:RELEASE_REF_TYPE -eq 'tag'
          # 发版标签：标签推送用推送的标签，分支推送用 Cargo 版本对应的标签；
          # 发版说明始终取与该标签同名的文件
          $tag = if ($isTagEvent) { $env:RELEASE_REF_NAME } else { $cargoTag }
          $notes = "doc/changelog/$tag.md"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_path=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # 标签必须已存在（在 dev 上打标签只表示准备发版）
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Skip "尚无版本标签 $tag，跳过发版（打标签只表示准备发版）"
          }

          # 标签必须已进入 main 历史：dev 上的标签推送永远不会发版；
          # squash / rebase 合并会丢失标签，需在 main 上重新打标签
          & git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw '拉取 main 失败，无法校验标签归属' }
          $tagCommit = (& git rev-list -n 1 "refs/tags/$tag").Trim()
          & git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            Skip "标签 $tag 未进入 main 历史，跳过发版（dev 分支只跑测试，不发版）"
          }

          # 已进入 main 的标签必须与 Cargo 版本一致，避免发错版本
          if ($tag -ne $cargoTag) {
            throw "标签 $tag 与 Cargo.toml 版本 $version 不一致，拒绝发版"
          }

          # 已发布的版本不重复发版；已有的 draft 则继续起草并发布
          $ErrorActionPreference = 'Continue'
          $state = & gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $ghExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          # gh 查不到 Release 会返回 1；重置，避免 Actions 用最后的退出码判失败
          $LASTEXITCODE = 0
          if ($ghExitCode -eq 0 -and "$state".Trim() -eq 'false') {
            Skip "$tag 已发布，跳过发版"
          }

          if (-not (Test-Path -LiteralPath $notes)) {
            throw "缺少发版说明：$notes（须与标签同名，并随 dev 合并进 main）"
          }
          $body = Get-Content -LiteralPath $notes -Raw -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "发版说明为空：$notes"
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "将在 main 上使用发版说明 $notes 起草并发布 $tag"

      - name: Install Rust
        if: steps.meta.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        if: steps.meta.outputs.publish == 'true'

      - name: Test
        if: steps.meta.outputs.publish == 'true'
        run: cargo test --workspace

      - name: Package portable bundle
        if: steps.meta.outputs.publish == 'true'
        run: cargo run -p xtask -- package

      - name: Install NSIS
        if: steps.meta.outputs.publish == 'true'
        run: choco install nsis -y --no-progress

      - name: Build installer
        if: steps.meta.outputs.publish == 'true'
        run: cargo run -p xtask -- installer

      - name: Upload workflow artifacts
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: md-work-windows
          path: |
            dist/md-work-*-setup.exe
            dist/md-work-*-win64.zip
          if-no-files-found: error

      # 起草：以 main 为目标分支创建/更新 draft Release，并附上产物
      - name: Draft release on main
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_path }}
          generate_release_notes: false
          draft: true
          files: |
            dist/md-work-*-setup.exe
            dist/md-work-*-win64.zip

      # 发布：仍在同一条 main 流水线中把草稿转为正式 Release
      - name: Publish release on main
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release edit "$env:TAG" --draft=false
