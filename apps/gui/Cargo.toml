[package]
name = "md-work-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "md-work"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
mdwork-log = { path = "../../crates/mdwork-log" }
gpui-kit = { workspace = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "syntect",
] }
windows.workspace = true
rust-i18n.workspace = true
uuid.workspace = true
serde_json.workspace = true
futures = "0.3"
imagesize = "0.13"
mdwork-core = { path = "../../crates/mdwork-core" }
mdwork-render = { path = "../../crates/mdwork-render" }
mdwork-export = { path = "../../crates/mdwork-export" }
mdwork-mcp = { path = "../../crates/mdwork-mcp" }
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = [
    "syntect-fancy",
] }

[dev-dependencies]
# 无界面测试入口通过上游 crate 别名引入；
# 若启用 gpui-kit 的 `test-support` 特性，会连带引入可选的
# fast 后端，其 macOS 依赖与当前锁定版本冲突。
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[build-dependencies]
winresource = "0.1.34"
