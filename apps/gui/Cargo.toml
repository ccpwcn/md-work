[package]
name = "md-work-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "md-work"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "syntect",
] }
windows.workspace = true
rust-i18n.workspace = true
uuid.workspace = true
serde_json.workspace = true
mdwork-core = { path = "../../crates/mdwork-core" }
mdwork-render = { path = "../../crates/mdwork-render" }
mdwork-export = { path = "../../crates/mdwork-export" }
mdwork-mcp = { path = "../../crates/mdwork-mcp" }

[build-dependencies]
winresource = "0.1.34"
