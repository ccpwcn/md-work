recovery.title:
  en: "Recover unsaved edits"
  zh-CN: "恢复未保存的编辑"
recovery.desc:
  en: "These buffers were dirty when MoJiān last stopped. Restoring reopens the note with the recovered text; nothing is written until you save."
  zh-CN: "上次退出时这些笔记还有未保存的修改。恢复会重新打开笔记并载入快照内容，只有你手动保存后才会写回磁盘。"
